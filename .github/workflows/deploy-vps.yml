name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Pull latest code on VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        password: ${{ secrets.VPS_PASSWORD }}
        port: 5414
        command_timeout: 60s
        script: |
          cd /root/vortice
          git reset --hard
          git clean -fd
          git pull origin main
          /root/vortice/backend/venv/bin/pip install -q -r /root/vortice/backend/requirements.txt
          echo "Deploy OK: $(date)"
