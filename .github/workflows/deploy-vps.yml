name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        password: ${{ secrets.VPS_PASSWORD }}
        port: 5414
        script: |
          set -e
          cd /root/vortice
          git pull origin main
          source /root/vortice/backend/venv/bin/activate
          pip install -q -r backend/requirements.txt
          pkill -f "actualizar_tunel.py" || true
          sleep 2
          setsid bash -c 'cd /root/vortice && source backend/venv/bin/activate && python3 actualizar_tunel.py >> /tmp/vortice.log 2>&1' < /dev/null > /dev/null 2>&1 &
          sleep 4
          echo "✅ Deploy OK en $(date)"
          tail -8 /tmp/vortice.log || echo "(log vacio)"
